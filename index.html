<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tower Defence</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#15101a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    /* Phaser game container sits below the DOM UI layer */
    #game-root { position: fixed; inset: 0; z-index: 1; }
  </style>
</head>
<body>
  <!-- Phaser game canvas container -->
  <div id="game-root"></div>
  <!-- DOM UI layer — renders above the Phaser canvas -->
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
