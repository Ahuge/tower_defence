name = "td-signaling"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" }
]

[kv_namespaces]
bindings = [
  { binding = "ANALYTICS", id = "REPLACE_WITH_KV_NAMESPACE_ID", preview_id = "REPLACE_WITH_PREVIEW_KV_ID" }
]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[vars]
CORS_ORIGIN = "*"
