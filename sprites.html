<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sprite Sheet Renderer</title>
</head>
<body>

  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import SpritePreview from './src/sprite-preview.tsx';

      React.createElement(SpritePreview)
    );
  </script>
</body>
</html>
