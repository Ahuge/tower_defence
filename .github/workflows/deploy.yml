name: Deploy to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            WORK_DIR=$(mktemp -d)
            git worktree add "$WORK_DIR" gh-pages
          else
            WORK_DIR=$(mktemp -d)
            git worktree add --detach "$WORK_DIR"
            cd "$WORK_DIR"
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd -
          fi
          PR_BACKUP=""
          if [ -d "$WORK_DIR/pr" ]; then
            PR_BACKUP=$(mktemp -d)
            cp -r "$WORK_DIR/pr" "$PR_BACKUP/pr"
          fi
          cd "$WORK_DIR"
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r $OLDPWD/dist/* .
          if [ -n "$PR_BACKUP" ] && [ -d "$PR_BACKUP/pr" ]; then
            cp -r "$PR_BACKUP/pr" ./pr
            rm -rf "$PR_BACKUP"
          fi
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          BRANCH="${GITHUB_REF_NAME}"
          SHA="$(echo ${GITHUB_SHA} | cut -c1-7)"
          git commit -m "Deploy ${BRANCH} (${SHA})"
          git push origin gh-pages
          cd -
          git worktree remove "$WORK_DIR" --force
