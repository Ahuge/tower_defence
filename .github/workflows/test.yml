name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Cancel any in-progress test run when a new commit lands on the same
# branch / PR — only the latest commit matters for pass/fail signal.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type check first — fastest signal if something's broken.
      - name: Type check
        run: npx tsc --noEmit

      # Unit + component test suite.
      - name: Run tests
        run: npm test

      # Production build catches Vite/bundler-level regressions that
      # don't show up in the dev-time type check or test harness
      # (missing assets, broken imports under Rollup, etc).
      - name: Build
        run: npm run build
