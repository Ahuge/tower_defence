name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Cancel any in-progress test run when a new commit lands on the same
# branch / PR — only the latest commit matters for pass/fail signal.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type check first — fastest signal if something's broken.
      - name: Type check
        run: npx tsc --noEmit

      # Unit + component test suite.
      - name: Run tests
        run: npm test

      # Production build catches Vite/bundler-level regressions that
      # don't show up in the dev-time type check or test harness
      # (missing assets, broken imports under Rollup, etc).
      - name: Build
        run: npm run build

  # Playwright E2E — PR-only. Runs after the fast `test` job passes
  # so we don't waste browser time on a PR that's already broken.
  e2e:
    name: playwright e2e
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache Playwright's downloaded browser binaries — ~200MB that
      # would otherwise re-download on every PR.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The chromium browser may be cached but its system deps still
      # need installing (CI image base layer varies).
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # On failure, keep the HTML report + traces + videos so a
      # dev can open them locally via `gh run download`.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
