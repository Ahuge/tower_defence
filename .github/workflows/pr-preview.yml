name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for preview
        run: npx vite build --base /tower_defence/pr/${{ github.event.pull_request.number }}/
        env:
          NODE_ENV: production
      - name: Deploy preview to gh-pages
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PR_DIR="pr/${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages 2>/dev/null || git checkout --orphan gh-pages
          WORK_DIR=$(mktemp -d)
          git worktree add "$WORK_DIR" gh-pages
          mkdir -p "$WORK_DIR/${PR_DIR}"
          rm -rf "$WORK_DIR/${PR_DIR}/"*
          cp -r dist/* "$WORK_DIR/${PR_DIR}/"
          cd "$WORK_DIR"
          git add "${PR_DIR}"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Preview: PR #${PR_NUM} ($(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7))"
          git push origin gh-pages
          cd -
          git worktree remove "$WORK_DIR" --force
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/pr/${prNum}/`;
            const body = `### Preview Deploy\n\n**${sha}** deployed to: ${url}\n\n_Auto-deployed by PR Preview workflow. Updated on each push._`;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNum });
            const botComment = comments.data.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Preview Deploy'));
            if (botComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: botComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });
            }
